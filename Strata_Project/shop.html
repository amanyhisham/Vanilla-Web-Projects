<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | STRATA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-forest font-sans">
  <div id="navbar"></div>

  <main>
    <section class="hero-bg">
      <div class="max-w-7xl mx-auto px-4 py-12">
        <h1 class="font-serif text-4xl md:text-5xl">Discover Our Creations</h1>
        <p class="mt-3 text-forest/80 max-w-xl">Beautiful handmade products created from materials that deserve a second life.</p>
      </div>
    </section>

    <section class="max-w-7xl mx-auto px-4 py-8">
      <div id="chips" class="flex flex-wrap gap-2 mb-6"></div>

      <div class="flex flex-col md:flex-row gap-3 mb-6">
        <input id="search" type="search" placeholder="Search products..." aria-label="Search products"
               class="flex-1 rounded-full border border-beige bg-white px-5 py-3 focus:outline-none focus:ring-2 focus:ring-olive">
        <select id="sort" aria-label="Sort products"
                class="rounded-full border border-beige bg-white px-5 py-3 focus:outline-none focus:ring-2 focus:ring-olive">
          <option value="newest">Newest</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="name">Name (A-Z)</option>
        </select>
        <button id="clear" class="rounded-full border border-forest px-5 py-3 hover:bg-forest hover:text-white transition">Clear filters</button>
      </div>

      <p id="count" class="text-sm text-brown mb-4"></p>
      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>

      <div class="text-center mt-10">
        <button id="more" class="hidden bg-forest text-white px-8 py-3 rounded-full hover:bg-olive transition">Show more</button>
      </div>

      <div id="none" class="hidden text-center py-16">
        <p class="font-serif text-2xl">No products found</p>
        <p class="text-brown mt-1">Try a different search or clear the filters.</p>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="products.js"></script>
  <script src="main.js"></script>
  <script>
    const PAGE_SIZE = 8; // products shown at first, and added with each "Show more"
    const params = new URLSearchParams(location.search);
    const state = { cat: params.get('category') || 'all', q: '', sort: 'newest', visible: PAGE_SIZE };

    const chipsEl = document.getElementById('chips');
    const gridEl = document.getElementById('grid');
    const searchEl = document.getElementById('search');
    const sortEl = document.getElementById('sort');
    const moreEl = document.getElementById('more');
    const chips = [['all', 'All Products'], ...CATEGORIES.map((c) => [c.id, c.name])];

    function renderChips() {
      chipsEl.innerHTML = chips.map(([id, name]) => `
        <button data-cat="${id}" class="px-5 py-2 rounded-full text-sm border transition
          ${state.cat === id ? 'bg-forest text-white border-forest' : 'bg-beige text-forest border-beige hover:border-olive'}">${name}</button>`).join('');
    }

    function render() {
      const all = PRODUCTS.filter((p) =>
        (state.cat === 'all' || p.category === state.cat) &&
        p.name.toLowerCase().includes(state.q.trim().toLowerCase()));

      if (state.sort === 'low') all.sort((a, b) => a.price - b.price);
      if (state.sort === 'high') all.sort((a, b) => b.price - a.price);
      if (state.sort === 'name') all.sort((a, b) => a.name.localeCompare(b.name));
      if (state.sort === 'newest') all.sort((a, b) => b.createdAt.localeCompare(a.createdAt));

      const shown = all.slice(0, state.visible);
      gridEl.innerHTML = shown.map(productCard).join('');
      document.getElementById('count').textContent =
        all.length ? `Showing ${shown.length} of ${all.length} product${all.length === 1 ? '' : 's'}` : '';
      document.getElementById('none').classList.toggle('hidden', all.length > 0);

      const left = all.length - shown.length;
      moreEl.classList.toggle('hidden', left <= 0);
      moreEl.textContent = `Show more (${left} more)`;
      renderChips();
    }

    const resetAndRender = () => { state.visible = PAGE_SIZE; render(); };

    chipsEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-cat]');
      if (b) { state.cat = b.dataset.cat; resetAndRender(); }
    });
    searchEl.addEventListener('input', () => { state.q = searchEl.value; resetAndRender(); });
    sortEl.addEventListener('change', () => { state.sort = sortEl.value; resetAndRender(); });
    moreEl.addEventListener('click', () => { state.visible += PAGE_SIZE; render(); });
    document.getElementById('clear').addEventListener('click', () => {
      state.cat = 'all'; state.q = ''; state.sort = 'newest';
      searchEl.value = ''; sortEl.value = 'newest';
      resetAndRender();
    });

    render();
  </script>
</body>
</html>
